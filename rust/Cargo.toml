[package]
name = "skyblock-config-manager"
version = "4.1.6"
edition = "2024"
rust-version = "1.85"
description = "Keeps each Hypixel SkyBlock feature switched on in only one of your Fabric mods."
publish = false
build = "build.rs"

[lib]
name = "scm"
path = "src/lib.rs"

[[bin]]
name = "SkyblockConfigManager"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd", "dep:ico"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
indexmap = { version = "2.12.0", features = ["serde"] }
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "0.11.0"
tempfile = "3.27.0"
ureq = { version = "3.5.2", features = ["platform-verifier"] }
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }

egui_extras = { version = "0.37.0", optional = true }
ico = { version = "0.6.0", optional = true }
rfd = { version = "0.18.0", optional = true }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true
